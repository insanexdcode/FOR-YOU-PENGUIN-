<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Pyari Si Bestfriend ❤️</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;
  justify-content:center;font-family:Arial,sans-serif;color:#fff0f4;
  background:radial-gradient(ellipse at top,#501426,#16060d 65%,#060208);
  padding:20px
}
.card{
  width:100%;max-width:390px;text-align:center;padding:38px 26px;
  border:1px solid #a74763;border-radius:24px;
  background:#210b15d9;box-shadow:0 0 40px #9c17444d
}
.heart{font-size:48px;animation:pulse 1.5s infinite}
h1{font-family:Georgia,serif;font-weight:normal;color:#ffb4c8}
p{color:#e6b9c7;line-height:1.6}
input,button{
  width:100%;padding:14px;border-radius:12px;font-size:16px
}
input{
  border:1px solid #824055;background:#16070e;color:white;
  outline:none;margin:12px 0
}
button{
  border:0;background:linear-gradient(90deg,#a91e4b,#ed668c);
  color:white;font-weight:bold;cursor:pointer
}
button:hover{filter:brightness(1.12)}
#error{color:#ff829d;min-height:20px;font-size:14px}
@keyframes pulse{50%{transform:scale(1.12)}}
</style>
</head>
<body>
<div class="card">
  <div class="heart">❤️</div>
  <h1>For My Penguin</h1>
  <p>Jaldi kholo na moti.<br>
  Enter the secret password to open it.</p>

  <form id="loginForm">
    <input id="password" type="password"
      placeholder="Enter our secret password" required>
    <button type="submit">Open My Little World 💌</button>
  </form>
  <p id="error"></p>
</div>

<script>
const SECRET_PASSWORD = "1710"
document.getElementById("loginForm").addEventListener("submit", function(e){
  e.preventDefault();

  if(document.getElementById("password").value === SECRET_PASSWORD){
    sessionStorage.setItem("hooriaAccess", "yes");
    window.location.href = "letter.html";
  } else {
    document.getElementById("error").textContent =
      "Wrong password, try again 😰";
  }
});
</script>
</body>
</html>
